# Builds Device Lab installers on each OS and attaches them to a draft GitHub Release.
# Trigger: push a tag like v0.1.0, or run manually from the Actions tab.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs (tag in the comment); Dependabot bumps them.
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write # tauri-action creates the release and uploads assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # .dmg + .app, universal (Intel + Apple Silicon)
            args: --target universal-apple-darwin
          - platform: windows-latest # .msi + NSIS -setup.exe
            args: ''
          - platform: ubuntu-22.04 # .deb + .rpm + .AppImage (oldest glibc = widest compatibility)
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      # What's new: shown in the GitHub release and in the app's update dialog (latest.json notes).
      - id: notes
        shell: bash
        run: |
          {
            echo 'body<<NOTES_EOF'
            cat .github/release-notes.md
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signatures (required): key pair from `pnpm tauri signer generate`, public half in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Code signing (optional). Add these repository secrets to sign builds:
          # macOS: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          #        APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
          # Windows: see https://v2.tauri.app/distribute/sign/windows/
        with:
          tagName: v__VERSION__
          releaseName: Device Lab v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          includeUpdaterJson: true
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
